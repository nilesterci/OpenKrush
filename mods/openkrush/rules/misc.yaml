# Shared player setup.
^CorePlayer:
	# This actor is not affected by shroud or fog.
	AlwaysVisible:
	# Enable shroud and fog.
	Shroud:
		FogCheckboxLabel: Névoa de guerra
		FogCheckboxDescription: É preciso ter linha de visão para ver as forças inimigas
		ExploredMapCheckboxLabel: Mapa explorado
		ExploredMapCheckboxDescription: O mapa começa revelado


# Ingame specific player setup.
Player:
	Inherits: ^CorePlayer
	# Developer debug menu
	DeveloperMode:
		CheckboxLabel: Menu de depuração
		CheckboxDescription: Ativa trapaças e comandos de desenvolvedor
	# Allow players to place building.
	PlaceBuilding:
	# Required for mission scripts to attach player triggers (OnPlayerWon...).
	ScriptTriggers:
	# Enable mission objectives, required to win or loose mission.
	MissionObjectives:
	# Default objective: Win by killing all enemies.
	ConquestVictoryConditions:
	# Amount of selectable starting resources.
	PlayerResources:
		DefaultCashDropdownLabel: Recursos
		DefaultCashDropdownDescription: Quantidade de dinheiro com que os jogadores começam
		SelectableCash: 5000, 6000, 8000, 10000, 12500, 15000
	# Enable super weapons support.
	SupportPowerManager:
	# Manage build limits and pre-requisites.
	TechTree:
	# Required for FrozenUnderFog to work
	FrozenActorLayer:
	# Play notification when base is attacked.
	AdvancedAttackNotifier:
	# The global production queues, not attached to a single factory.
	SelfConstructingProductionQueue@Building:
		Type: building
		ReadyAudio: BuildingReady
	SelfConstructingProductionQueue@Tower:
		Type: tower
		ReadyAudio: BuildingReady
	SelfConstructingProductionQueue@Walls:
		Type: wall
	PlaceBeacon:
		ArrowSequence:
		CircleSequence: x
		Duration: 250

# Map editor specific player setup.
EditorPlayer:
	Inherits: ^CorePlayer

# Shared world setup.
^CoreWorld:
	# Make palettes usable in the world.
	Inherits: ^Palettes
	# Always render the world.
	AlwaysVisible:
	# Required for interaction between game window and input with the map.
	ScreenMap:
	# Required to cache and query actors on the map.
	ActorMap:
	# Implement music playback to the game.
	MusicPlaylist: # TODO per faction music!
	# Terrain rendering setup.
	TerrainRenderer:
	# Shroud rendering setup.
	ShroudRenderer:
		OverrideFullShroud: shroudfull
		OverrideFullFog: fogfull
		ShroudBlend: Multiply
	# Random faction setup.
	Faction@Random:
		Name: Aleatória
		InternalName: Random
		Side: Random
	# Required for UI to load.
	LoadWidgetAtGameStart:
	# Required to show the map grid.
	TerrainGeometryOverlay:
	# Required for debug overlays:
	DebugVisualizations:
	# Required for... not crashing.
	Selection:
	# Required for control groups support.
	ControlGroups:

# Ingame specific world setup.
World:
	Inherits: ^CoreWorld
	# Required for warhead debug overlays.
	WarheadDebugOverlay:
	# Smudge support.
	SmudgeLayer@CRATER:
		Type: Crater
		Sequence: crater
		SmokeChance: -1
		SmokePalette:
	# Required for buildable area checks.
	BuildingInfluence:
	# Pathfinding requirement.
	PathFinder:
	# Support for prespawned actors.
	SpawnMapActors:
	# Default game settings: gamespeed, techlevel, shortgame.
	MapOptions:
		ShortGameCheckboxLabel: Partida curta
		ShortGameCheckboxDescription: Jogadores são derrotados quando suas bases são destruídas
		TechLevelDropdownLabel: Nível tecnológico
		TechLevelDropdownDescription: As unidades e habilidades que os jogadores podem usar
		GameSpeedDropdownLabel: Velocidade
		GameSpeedDropdownDescription: A velocidade com que o tempo passa
	# Required for spawnpoint support.
	MapStartingLocations:
		SeparateTeamSpawnsCheckboxLabel: Separar equipes
		SeparateTeamSpawnsCheckboxDescription: Jogadores sem ponto de início definido começam o mais longe possível dos inimigos
	# Required to setup the players in lobby.
	CreateMapPlayers:
	# Required to spawn player units at spawnpoint.
	SpawnStartingUnits:
		DropdownLabel: Unidades
		DropdownDescription: As unidades com que os jogadores começam a partida
		StartingUnitsClass: support
	# Cheat protection.
	ValidateOrder:
	# Requirement for shaking the screen if a building explodes.
	ScreenShaker:
		MinMultiplier: -10,0
		MaxMultiplier: 10,0
	# Used to manage beacons.
	RadarPings:
	# Required for the color picker.
	ColorPickerManager:
		PreviewActor: colorpicker
	# Required for chat commands.
	ChatCommands:
	HelpCommand:
	PlayerCommands:
	DevCommands:
	DebugVisualizationCommands:

	LobbyOptionCategory@oilpatch:
		Category: oilpatch
		Title: Petróleo
	# Oilpatch selectbox.
	OilAmount:
	# Oilpatch selectbox.
	OilBurn:

	LobbyOptionCategory@research:
		Category: research
		Title: Pesquisa
	# TechLimit selectbox.
	TechLimit:
	# Research duration selectbox.
	ResearchDuration:
	# Research mode selectbox.
	ResearchMode:

	LobbyOptionCategory@techbunker:
		Category: techbunker
		Title: Tech Bunkers
	# TechBunker amount selectbox.
	TechBunkerAmount:
	# TechBunker contains selectbox.
	TechBunkerContains:
	# TechBunker usage selectbox.
	TechBunkerUsage:
	# TechBunker uses selectbox.
	TechBunkerUses:

	LobbyOptionCategory@saboteur:
		Category: saboteur
		Title: Sabotagem
	# Saboteur usage selectbox.
	SaboteurUsage:

# Map editor specific world setup.
EditorWorld:
	Inherits: ^CoreWorld
	# Displays actors in editor.
	EditorActorLayer:
	# Selecting, Copying, Pasting Support for map editor.
	EditorSelectionLayer:
	# Cursor attached stuff.
	EditorCursorLayer:
	# Undo / Redo support.
	EditorActionManager:
	# Displays where buildings can be build.
	BuildableTerrainOverlay:
		AllowedTerrainTypes: clear
		Palette: openkrush
