Container@LOCAL_PROFILE_PANEL:
	Logic: LocalProfileLogic
	Width: 270
	Height: 100
	Children:
		Background@PROFILE_HEADER:
			Width: PARENT_RIGHT
			Height: 50
			Background: dialog2
			Children:
				Label@PROFILE_NAME:
					X: 10
					Y: 5
					Width: PARENT_RIGHT - 20
					Height: 25
					Font: MediumBold
				Label@PROFILE_RANK:
					X: 10
					Y: 24
					Width: PARENT_RIGHT - 20
					Height: 25
					Font: TinyBold
				Button@DESTROY_KEY:
					X: PARENT_RIGHT - 70
					Y: 15
					Width: 60
					Height: 20
					Font: TinyBold
					Text: Desconectar
		Background@BADGES_CONTAINER:
			Width: PARENT_RIGHT
			Y: 48
			Visible: false
			Background: dialog3
		Background@GENERATE_KEYS:
			Width: PARENT_RIGHT
			Height: PARENT_BOTTOM
			Background: dialog2
			Children:
				Label@DESC_A:
					Y: 5
					Width: PARENT_RIGHT
					Height: 25
					Font: Small
					Align: Center
					Text: Conecte uma conta do fórum para se identificar
				Label@DESC_B:
					Y: 21
					Width: PARENT_RIGHT
					Height: 25
					Font: Small
					Align: Center
					Text: para outros jogadores, entrar em servidores
				Label@DESC_C:
					Y: 37
					Width: PARENT_RIGHT
					Height: 25
					Font: Small
					Align: Center
					Text: privados e exibir medalhas.
				Button@GENERATE_KEY:
					X: (PARENT_RIGHT - WIDTH) / 2
					Y: 70
					Width: 240
					Height: 20
					Font: TinyBold
					Text: Conectar a uma conta do fórum do OpenRA
		Background@GENERATING_KEYS:
			Width: PARENT_RIGHT
			Height: PARENT_BOTTOM
			Background: dialog2
			Children:
				Label@DESC_A:
					Y: 13
					Width: PARENT_RIGHT
					Height: 25
					Font: Small
					Align: Center
					Text: Gerando par de chaves de autenticação.
				Label@DESC_B:
					Y: 29
					Width: PARENT_RIGHT
					Height: 25
					Font: Small
					Align: Center
					Text: Isso vai levar alguns segundos...
				ProgressBar:
					X: (PARENT_RIGHT - WIDTH) / 2
					Y: 70
					Width: 240
					Height: 20
					Indeterminate: true
		Background@REGISTER_FINGERPRINT:
			Width: PARENT_RIGHT
			Height: PARENT_BOTTOM
			Background: dialog2
			Children:
				Label@DESC_A:
					Y: 2
					Width: PARENT_RIGHT
					Height: 25
					Font: Small
					Align: Center
					Text: Uma chave de autenticação foi copiada para a sua
				Label@DESC_B:
					Y: 18
					Width: PARENT_RIGHT
					Height: 25
					Font: Small
					Align: Center
					Text: área de transferência. Adicione-a ao seu Painel de Controle
				Label@DESC_C:
					Y: 34
					Width: PARENT_RIGHT
					Height: 25
					Font: Small
					Align: Center
					Text: no fórum do OpenRA e clique em Continuar.
				Button@DELETE_KEY:
					X: 15
					Y: 70
					Width: 70
					Height: 20
					Font: TinyBold
					Text: Cancelar
				Button@CHECK_KEY:
					X: 185
					Y: 70
					Width: 70
					Height: 20
					Font: TinyBold
					Text: Continuar
		Background@CHECKING_FINGERPRINT:
			Width: PARENT_RIGHT
			Height: PARENT_BOTTOM
			Background: dialog2
			Children:
				Label@DESC_A:
					Y: 13
					Width: PARENT_RIGHT
					Height: 25
					Font: Small
					Align: Center
					Text: Buscando os dados da conta no
				Label@DESC_B:
					Y: 29
					Width: PARENT_RIGHT
					Height: 25
					Font: Small
					Align: Center
					Text: fórum do OpenRA...
				ProgressBar:
					X: (PARENT_RIGHT - WIDTH) / 2
					Y: 70
					Width: 240
					Height: 20
					Indeterminate: true
		Background@FINGERPRINT_NOT_FOUND:
			Width: PARENT_RIGHT
			Height: PARENT_BOTTOM
			Background: dialog2
			Children:
				Label@DESC_A:
					Y: 13
					Width: PARENT_RIGHT
					Height: 25
					Font: Small
					Align: Center
					Text: Sua chave de autenticação não está conectada
				Label@DESC_B:
					Y: 29
					Width: PARENT_RIGHT
					Height: 25
					Font: Small
					Align: Center
					Text: a uma conta do fórum do OpenRA.
				Button@FINGERPRINT_NOT_FOUND_CONTINUE:
					X: 185
					Y: 70
					Width: 70
					Height: 20
					Font: TinyBold
					Text: Voltar
		Background@CONNECTION_ERROR:
			Width: PARENT_RIGHT
			Height: PARENT_BOTTOM
			Background: dialog2
			Children:
				Label@DESC_A:
					Y: 13
					Width: PARENT_RIGHT
					Height: 25
					Font: Small
					Align: Center
					Text: Falha ao conectar ao fórum do OpenRA.
				Label@DESC_B:
					Y: 29
					Width: PARENT_RIGHT
					Height: 25
					Font: Small
					Align: Center
					Text: Verifique sua conexão com a internet.
				Button@CONNECTION_ERROR_RETRY:
					X: 185
					Y: 70
					Width: 70
					Height: 20
					Font: TinyBold
					Text: Tentar de novo

Container@PLAYER_PROFILE_BADGES_INSERT:
	Logic: PlayerProfileBadgesLogic
	Width: PARENT_RIGHT
	Height: 110
	Children:
		Container@BADGE_TEMPLATE:
			Width: PARENT_RIGHT
			Height: 25
			Children:
				Badge@ICON:
					X: 6
					Y: 1
					Width: 24
					Height: 24
				Label@LABEL:
					X: 36
					Y: 2
					Width: PARENT_RIGHT - 60
					Height: 24
					Font: Bold
