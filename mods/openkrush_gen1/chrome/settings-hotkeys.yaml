Container@HOTKEYS_PANEL:
	Logic: HotkeysSettingsLogic
		HotkeyGroups:
			Comandos do jogo:
				Types: OrderGenerator, World, Menu
			Câmera:
				Types: Viewport
			Espectador / Replay:
				Types: Observer, Replay
			Comandos de unidade:
				Types: Unit
			Postura das unidades:
				Types: Stance
			Produção:
				Types: Production, ProductionSlot
			Poderes especiais:
				Types: SupportPower
			Música:
				Types: Music
			Chat:
				Types: Chat
			Grupos de controle:
				Types: ControlGroups
			Editor de mapas:
				Types: Editor
	Width: PARENT_RIGHT
	Height: PARENT_BOTTOM
	Children:
		Label@FILTER_INPUT_LABEL:
			Width: 100
			Height: 25
			Font: Bold
			Text: Filtrar por nome:
		TextField@FILTER_INPUT:
			X: 108
			Width: 180
			Height: 25
		Label@CONTEXT_DROPDOWN_LABEL:
			X: PARENT_RIGHT - WIDTH - 195 - 5
			Width: 100
			Height: 25
			Font: Bold
			Text: Contexto:
			Align: Right
		DropDownButton@CONTEXT_DROPDOWN:
			X: PARENT_RIGHT - WIDTH
			Width: 195
			Height: 25
			Font: Bold
		ScrollPanel@HOTKEY_LIST:
			Y: 35
			Width: PARENT_RIGHT
			Height: PARENT_BOTTOM - 65 - 35
			TopBottomSpacing: 5
			ItemSpacing: 5
			Children:
				Container@HEADER:
					Width: PARENT_RIGHT - 24 - 10
					Height: 18
					Children:
						Background@BACKGROUND:
							Width: PARENT_RIGHT
							Height: 13
							Background: separator
							ClickThrough: True
						Label@LABEL:
							Width: PARENT_RIGHT
							Height: 13
							Font: TinyBold
							Align: Center
				Container@TEMPLATE:
					Width: (PARENT_RIGHT - 24) / 2 - 10
					Height: 30
					Visible: false
					Children:
						Label@FUNCTION:
							Y: 0 - 1
							Width: PARENT_RIGHT - 120 - 5
							Height: 25
							Align: Right
						Button@HOTKEY:
							X: PARENT_RIGHT - WIDTH
							Width: 120
							Height: 25
							TooltipContainer: SETTINGS_TOOLTIP_CONTAINER
		Container@HOTKEY_EMPTY_LIST:
			Width: PARENT_RIGHT
			Height: PARENT_BOTTOM
			Visible: false
			Children:
				Label@HOTKEY_EMPTY_LIST_MESSAGE:
					Width: PARENT_RIGHT
					Height: PARENT_BOTTOM
					Align: Center
					Text: Nenhum atalho corresponde ao filtro.
		Background@HOTKEY_REMAP_BGND:
			Y: PARENT_BOTTOM - HEIGHT
			Width: PARENT_RIGHT
			Height: 65
			Background: dialog3
			Children:
				Container@HOTKEY_REMAP_DIALOG:
					Width: PARENT_RIGHT
					Height: PARENT_BOTTOM
					Children:
						Label@HOTKEY_LABEL:
							X: 15
							Y: 19
							Width: 200
							Height: 25
							Font: Bold
							Align: Right
						HotkeyEntry@HOTKEY_ENTRY:
							X: 15 + 200 + 5
							Y: 20
							Width: 300
							Height: 25
						Container@NOTICES:
							X: 15 + 200 + 5
							Y: 42
							Width: 300
							Height: 25
							Children:
								Label@ORIGINAL_NOTICE:
									Width: PARENT_RIGHT
									Height: PARENT_BOTTOM
									Font: Tiny
									Text: O padrão é "{0}"
								Label@DUPLICATE_NOTICE:
									Width: PARENT_RIGHT
									Height: PARENT_BOTTOM
									Font: Tiny
									Text: Já está em uso por "{0}" no contexto {1}
								Label@READONLY_NOTICE:
									Width: PARENT_RIGHT
									Height: PARENT_BOTTOM
									Font: Tiny
									Text: Este atalho não pode ser alterado
						Button@OVERRIDE_HOTKEY_BUTTON:
							X: PARENT_RIGHT - 3 * WIDTH - 30
							Y: 20
							Width: 70
							Height: 25
							Text: Substituir
							Font: Bold
						Button@CLEAR_HOTKEY_BUTTON:
							X: PARENT_RIGHT - 2 * WIDTH - 30
							Y: 20
							Width: 65
							Height: 25
							Text: Limpar
							Font: Bold
							TooltipText: Remover o atalho
							TooltipContainer: SETTINGS_TOOLTIP_CONTAINER
							TooltipTemplate: SIMPLE_TOOLTIP
						Button@RESET_HOTKEY_BUTTON:
							X: PARENT_RIGHT - WIDTH - 20
							Y: 20
							Width: 65
							Height: 25
							Text: Redefinir
							Font: Bold
							TooltipText: Restaurar padrão
							TooltipContainer: SETTINGS_TOOLTIP_CONTAINER
							TooltipTemplate: SIMPLE_TOOLTIP
