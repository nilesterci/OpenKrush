Background@KICK_CLIENT_DIALOG:
	Width: PARENT_RIGHT
	Height: PARENT_BOTTOM
	Logic: KickClientLogic
	Background: dialog3
	Children:
		Label@TITLE:
			Y: 41
			Width: PARENT_RIGHT
			Height: 25
			Font: Bold
			Align: Center
		Label@TEXTA:
			Y: 68
			Width: PARENT_RIGHT
			Height: 25
			Font: Regular
			Align: Center
			Text: Você também pode aplicar um banimento temporário, impedindo
		Label@TEXTB:
			Y: 86
			Width: PARENT_RIGHT
			Height: 25
			Font: Regular
			Align: Center
			Text: que ele volte até o fim desta partida.
		Checkbox@PREVENT_REJOINING_CHECKBOX:
			X: (PARENT_RIGHT - WIDTH) / 2
			Y: 120
			Width: 150
			Height: 20
			Text: Banir temporariamente
		Button@OK_BUTTON:
			X: (PARENT_RIGHT - WIDTH) / 2 + 75
			Y: 155
			Width: 120
			Height: 25
			Text: Expulsar
			Font: Bold
		Button@CANCEL_BUTTON:
			X: (PARENT_RIGHT - WIDTH) / 2 - 75
			Y: 155
			Width: 120
			Height: 25
			Text: Cancelar
			Font: Bold

Background@KICK_SPECTATORS_DIALOG:
	Width: PARENT_RIGHT
	Height: PARENT_BOTTOM
	Logic: KickSpectatorsLogic
	Background: dialog3
	Children:
		Label@TITLE:
			Y: 41
			Width: PARENT_RIGHT
			Height: 25
			Font: Bold
			Align: Center
			Text: Expulsar espectadores
		Label@TEXT:
			Y: 86
			Width: PARENT_RIGHT
			Height: 25
			Font: Regular
			Align: Center
		Button@OK_BUTTON:
			X: (PARENT_RIGHT - WIDTH) / 2 + 75
			Y: 155
			Width: 120
			Height: 25
			Text: Ok
			Font: Bold
		Button@CANCEL_BUTTON:
			X: (PARENT_RIGHT - WIDTH) / 2 - 75
			Y: 155
			Width: 120
			Height: 25
			Text: Cancelar
			Font: Bold

Background@FORCE_START_DIALOG:
	Width: PARENT_RIGHT
	Height: PARENT_BOTTOM
	Background: dialog3
	Children:
		Label@TITLE:
			Y: 41
			Width: PARENT_RIGHT
			Height: 25
			Font: Bold
			Align: Center
			Text: Iniciar jogo?
		Label@TEXTA:
			Y: 68
			Width: PARENT_RIGHT
			Height: 25
			Font: Regular
			Align: Center
			Text: Um ou mais jogadores ainda não estão prontos.
		Label@TEXTB:
			Y: 86
			Width: PARENT_RIGHT
			Height: 25
			Font: Regular
			Align: Center
			Text: Tem certeza de que quer forçar o início do jogo?
		Container@KICK_WARNING:
			Width: PARENT_RIGHT
			Children:
				Label@KICK_WARNING_A:
					X: 0
					Y: 107
					Width: PARENT_RIGHT
					Height: 25
					Font: Bold
					Align: Center
					Text: Um ou mais clientes não têm o mapa
				Label@KICK_WARNING_B:
					X: 0
					Y: 124
					Width: PARENT_RIGHT
					Height: 25
					Font: Bold
					Align: Center
					Text: e serão expulsos do servidor.
		Button@OK_BUTTON:
			X: (PARENT_RIGHT - WIDTH) / 2 + 75
			Y: 155
			Width: 120
			Height: 25
			Text: Iniciar
			Font: Bold
		Button@CANCEL_BUTTON:
			X: (PARENT_RIGHT - WIDTH) / 2 - 75
			Y: 155
			Width: 120
			Height: 25
			Text: Cancelar
			Font: Bold
