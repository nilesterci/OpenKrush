# Chão gerado a partir dos pixels originais do KKnD; os blocos do tileset só definem o terreno.
World:
	PaletteFromPng@mapground:
		Name: mapground
		Filename: mapground-palette.png

^MapGround:
	WithSpriteBody:
	BodyOrientation:
	QuantizeFacingsFromSequence:
	Immobile:
		OccupiesSpace: false
	AlwaysVisible:

mapground_0_0:
	Inherits: ^MapGround
	RenderSprites:
		Image: mapground_0_0
		Palette: mapground

